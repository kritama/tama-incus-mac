name: Homebrew candidate

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - Packaging/homebrew/**
      - Sources/**
      - Package.swift
      - .github/workflows/homebrew-candidate.yml

permissions:
  contents: read

concurrency:
  group: homebrew-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bottle:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
      - name: Prepare immutable source candidate
        run: python3 Packaging/homebrew/candidate.py prepare --output .integration/homebrew-candidate
      - name: Build and validate bottle
        run: python3 Packaging/homebrew/candidate.py build --opt-in --candidate .integration/homebrew-candidate
      - name: Remove source build before bottle acceptance
        run: brew uninstall upmaru/macus-local/macus
      - name: Install and validate prebuilt bottle
        run: python3 Packaging/homebrew/candidate.py install --opt-in --candidate .integration/homebrew-candidate
      - name: Retain candidate artifacts and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homebrew-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .integration/homebrew-candidate/*.tar.gz
            .integration/homebrew-candidate/*.bottle.json
            .integration/homebrew-candidate/candidate.json
            .integration/homebrew-candidate/formula.rb.in
            .integration/homebrew-candidate/package-acceptance.json
            .integration/homebrew-candidate/tap/Formula/macus.rb
            .integration/homebrew-candidate/*.log
