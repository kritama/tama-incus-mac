name: Native checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Swift and OpenSpec
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Toolchain
        run: swift --version
      - name: Debug, tests, release, formatting and guest syntax
        run: Integration/scripts/check.sh
      - name: Validate OpenSpec
        run: npx --yes --package @fission-ai/openspec@1.14.0 openspec validate --all --strict --no-interactive
